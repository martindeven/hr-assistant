<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="max-history-messages" content="{{MAX_HISTORY_MESSAGES}}">
  <meta name="max-history-chars" content="{{MAX_HISTORY_CHARS}}">
  <title>HR Assistant</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <h1>Asistente de Recursos Humanos</h1>
  <div class="key-row">
    <label for="api-key">Clave de acceso</label>
    <input id="api-key" data-testid="api-key" type="password"
           placeholder="Escribe la clave que te dieron" autocomplete="off">
  </div>
  <div id="conversation" data-testid="answer" aria-live="polite"></div>
  <form id="ask-form">
    <input id="question" data-testid="question" type="text"
           placeholder="Pregunta por un empleado (EMP-0001) o un departamento"
           autocomplete="off">
    <button id="send" data-testid="send" type="submit">Enviar</button>
  </form>
  <template id="agents-template">
    <p class="message agents" data-testid="agents"></p>
  </template>
  <template id="guardrail-notice-template">
    <p class="message guardrail-notice" data-testid="guardrail-notice">Se ocultaron datos sensibles</p>
  </template>
  <!-- La lógica vive en /static/app.js (la CSP no permite código en línea):
       pinta todo con textContent (también el request_id de cada respuesta),
       guarda la clave solo en sessionStorage de la pestaña y la manda en el
       encabezado X-API-Key. -->
  <script src="/static/app.js" defer></script>
</body>
</html>
